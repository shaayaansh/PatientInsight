<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box  { fill:#ffffff; stroke:#94a3b8; stroke-width:1.2; rx:8; }
      .llm  { fill:#eef2ff; stroke:#6366f1; stroke-width:1.4; rx:8; }
      .ver  { fill:#fff7ed; stroke:#f97316; stroke-width:1.4; rx:8; }
      .ret  { fill:#f0fdf4; stroke:#22c55e; stroke-width:1.4; rx:8; }
      .t    { font-size:14px; font-weight:600; fill:#0f172a; }
      .s    { font-size:12px; fill:#334155; }
      .tag  { font-size:11.5px; fill:#64748b; font-style:italic; }
      .edge { stroke:#475569; stroke-width:1.5; fill:none; marker-end:url(#a); }
      .lbl  { font-size:11.5px; fill:#475569; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="498" fill="#ffffff"/>

  <!-- orchestrator boundary -->
  <rect x="160" y="14" width="826" height="472" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="178" y="38" class="t" fill="#475569">Orchestrator</text>
  <text x="278" y="38" class="tag">run state · tool budgets · step limit · retries · checkpoints</text>

  <!-- question -->
  <rect x="14" y="70" width="128" height="56" class="box"/>
  <text x="78" y="94" class="t" text-anchor="middle">Question</text>
  <text x="78" y="112" class="s" text-anchor="middle">open-ended</text>

  <!-- agent: plan -->
  <rect x="190" y="58" width="290" height="80" class="llm"/>
  <text x="206" y="82" class="t">Agent · plan the search</text>
  <text x="206" y="102" class="s">core keywords · auxiliary keywords</text>
  <text x="206" y="120" class="s">semantic query</text>
  <path d="M142,98 L188,98" class="edge"/>

  <!-- search tool container -->
  <rect x="190" y="170" width="780" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="206" y="192" class="t">Search tool</text>

  <rect x="206" y="204" width="232" height="46" class="ret"/>
  <text x="222" y="224" class="t">BM25</text>
  <text x="222" y="241" class="s">core + 0.5 · auxiliary</text>

  <rect x="206" y="260" width="232" height="46" class="ret"/>
  <text x="222" y="280" class="t">Dense (MedEmbed)</text>
  <text x="222" y="297" class="s">query vs. note chunks, best chunk</text>

  <rect x="478" y="230" width="150" height="50" class="box"/>
  <text x="553" y="252" class="t" text-anchor="middle">Weighted RRF</text>
  <text x="553" y="269" class="s" text-anchor="middle">→ top-20 notes</text>
  <path d="M438,227 L476,247" class="edge"/>
  <path d="M438,283 L476,263" class="edge"/>

  <rect x="668" y="204" width="286" height="102" class="ver"/>
  <text x="684" y="226" class="t">Verifier (small LLM)</text>
  <text x="684" y="246" class="s">one call per note, in parallel</text>
  <text x="684" y="264" class="s">relevant · uncertain · not relevant</text>
  <text x="684" y="282" class="s">+ one-sentence reason</text>
  <text x="684" y="299" class="tag">optional (--verify)</text>
  <path d="M628,255 L666,255" class="edge"/>

  <!-- plan -> search -->
  <path d="M335,138 L335,168" class="edge"/>
  <text x="343" y="158" class="lbl">tool call</text>

  <!-- kept notes -> agent answer -->
  <path d="M811,306 L811,364" class="edge"/>
  <text x="819" y="340" class="lbl">kept notes + reasons</text>

  <!-- agent: answer -->
  <rect x="560" y="366" width="400" height="80" class="llm"/>
  <text x="576" y="390" class="t">Agent · answer from the notes</text>
  <text x="576" y="410" class="s">grounded only in what was read</text>
  <text x="576" y="428" class="s">every claim cited as [patient id]</text>

  <!-- answer -->
  <rect x="300" y="378" width="190" height="56" class="box"/>
  <text x="395" y="402" class="t" text-anchor="middle">Cited answer</text>
  <text x="395" y="420" class="s" text-anchor="middle">+ evidence, limitations</text>
  <path d="M558,406 L492,406" class="edge"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
